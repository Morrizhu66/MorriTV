<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Model Studio · Multi-provider Image / Video</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="grain"></div>
    <header class="topbar">
      <a class="brand" href="/" aria-label="Model Studio 首页"><span class="brand-mark">M</span><span>MODEL<br />STUDIO</span></a>
      <div class="system-status"><span class="pulse"></span><span id="health-text">正在检查本机模型配置</span></div>
      <div class="topbar-note">LOCAL ONLY · v1.0</div>
    </header>

    <main class="studio-shell">
      <aside class="rail" aria-label="生成模式">
        <button class="mode active" data-kind="image"><span class="mode-index">01</span><span class="mode-label">IMAGE<br /><em>Seedream</em></span></button>
        <button class="mode" data-kind="video"><span class="mode-index">02</span><span class="mode-label">MOTION<br /><em>Seedance</em></span></button>
        <div class="rail-foot">BATCH<br />WORKBENCH</div>
      </aside>

      <section class="composer">
        <div class="section-kicker">NEW PRODUCTION <span id="kind-label">/ IMAGE</span></div>
        <h1 id="title">把一个想法<br /><i>做成图像。</i></h1>
        <p class="intro" id="intro">选择模型后直接生成，每次提交对应一个完整任务。</p>

        <form id="generation-form">
          <div class="field model-field">
            <label for="profile">渲染引擎</label>
            <select id="profile" name="profile">
              <option value="seedream50-pro-ark-direct">Seedream 5.0 Pro · 2K</option>
              <option value="seedream43-ark-direct">Seedream 4.3 · 2K</option>
            </select>
          </div>

          <div id="generation-options" class="video-options hidden">
            <div class="field"><label for="ratio">画幅</label><select id="ratio" name="ratio"></select></div>
            <div class="field" id="duration-field"><label for="duration">时长</label><select id="duration" name="duration"></select></div>
            <div class="field"><label for="resolution">清晰度</label><select id="resolution" name="resolution"></select></div>
          </div>

          <div class="field prompt-field">
            <div class="label-row"><label for="prompts">提示词</label><span id="batch-count">当前任务 / 01</span></div>
            <textarea id="prompts" name="prompts" rows="7" placeholder="一位穿着银色裙装的女性，站在暴雨后的城市街道，电影感，低饱和、胶片颗粒"></textarea>
            <span class="hint" id="prompt-hint">整段提示词会作为一次生成提交 · 支持自由换行</span>
          </div>

          <div class="field references-field">
            <div class="label-row"><label>参考素材</label><span id="reference-hint">可选，支持多张图片</span></div>
            <label class="dropzone" id="dropzone" for="references">
              <input id="references" name="references" type="file" multiple accept="image/*" />
              <span class="plus">+</span><span>拖入或选择素材</span><small>图片将作为 Seedream 参考图</small>
            </label>
            <div id="reference-preview" class="reference-preview"></div>
          </div>

          <div id="form-error" class="form-error" role="alert"></div>
          <button class="submit" id="submit-button" type="submit"><span>排入制作队列</span><strong id="submit-count">01</strong><span class="arrow">↗</span></button>
        </form>
      </section>

      <section class="gallery-panel">
        <div class="gallery-head">
          <div><span class="section-kicker">PRODUCTION QUEUE</span><h2>成片台</h2></div>
          <button class="refresh" id="refresh-button" type="button" aria-label="刷新成片任务">刷新 <span aria-hidden="true">↻</span></button>
        </div>
        <div class="queue-overview" id="queue-overview" role="status" aria-live="polite" aria-label="任务状态概览">
          <div class="queue-stat total"><strong id="count-total">0</strong><span>全部</span></div>
          <div class="queue-stat active"><strong id="count-active">0</strong><span>进行中</span></div>
          <div class="queue-stat completed"><strong id="count-completed">0</strong><span>已完成</span></div>
          <div class="queue-stat failed"><strong id="count-failed">0</strong><span>失败</span></div>
        </div>
        <div class="gallery" id="gallery">
          <div class="empty"><span>◌</span><p>还没有任务</p><small>从左侧输入提示词，第一张成片会出现在这里。</small></div>
        </div>
      </section>
    </main>

    <template id="task-template">
      <article class="task-card">
        <div class="media-frame">
          <div class="placeholder"><span class="placeholder-mark">M</span><small class="placeholder-label">等待调度</small></div>
          <div class="status-badge"><span class="status-dot"></span><span class="task-status"></span></div>
        </div>
        <div class="card-body">
          <div class="card-meta"><span class="task-kind"></span></div>
          <p class="task-prompt"></p>
          <details class="task-prompt-details">
            <summary>完整提示词</summary>
            <p class="task-prompt-full"></p>
          </details>
          <details class="task-error-details" hidden>
            <summary>查看失败原因</summary>
            <p class="error-detail"></p>
          </details>
          <div class="card-actions"></div>
        </div>
      </article>
    </template>
    <dialog id="image-preview-dialog" class="image-preview-dialog" aria-label="生成图片大图预览">
      <button type="button" class="close-preview" data-close-preview aria-label="关闭大图预览">×</button>
      <img alt="" />
      <p class="preview-caption"></p>
    </dialog>
    <script src="app.js"></script>
  </body>
</html>
